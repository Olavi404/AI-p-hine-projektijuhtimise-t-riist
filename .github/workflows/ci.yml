name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Dependency audit (report only)
        run: npm audit --json
        continue-on-error: true

      - name: Generate dependency update for review (no repository writes)
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          node -e 'for(const f of ["package.json","package-lock.json"]){const s=Buffer.from(require("fs").readFileSync(f)).toString("base64");console.log("LOCKFILE_BEGIN "+f);for(let i=0;i<s.length;i+=1000)console.log("LOCKFILE_CHUNK "+s.slice(i,i+1000));console.log("LOCKFILE_END "+f)}'
          npm audit --json || true
